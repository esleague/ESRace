<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESRace Leaderboard</title>
  <link rel="icon" href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAALrUAADM6AAAwNsAANr3AGNj/wAI3vsAANPwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAiIiIgAAAAAid3dyIAAAAidBEXdyAAACdBMzFHcgAAJ3EzMWRyAAACERERFHIAAAJ0ZmZkcgAAZmZmAAByAFVmZmYAAAIAVWYGZgAAAAAAZmZmAAAAAAAGZmAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAA//8AAPgPAADwBwAA4AMAAOABAADgAQAA8AEAAPABAADgeQAAgH0AAIB/AADgfwAA8P8AAP//AAD//wAA" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1'
            }
          }
        }
      }
    }
  </script>

  <style>
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 1000px 100%;
      animation: shimmer 2s infinite;
    }
    .border-3 { border-width: 3px; }
    .sort-btn {
      background: white;
      color: #64748b;
    }
    .dark .sort-btn {
      background: #252d3d;
      color: #8393a7;
    }
    .sort-btn.active {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }
    .view-tab {
      background: white;
      color: #64748b;
    }
    .dark .view-tab {
      background: #252d3d;
      color: #8393a7;
    }
    .view-tab.active {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }
    .team-members-list { display: none; }
    .team-members-list.open { display: block; }
    .team-members-list table { font-variant-numeric: tabular-nums; }

    /* Goal progress bar tier effects */
    @keyframes bar-shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }
    .bar-shimmer::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.25) 40%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0.25) 60%, transparent 100%);
      animation: bar-shimmer 2.5s ease-in-out infinite;
    }
    .bar-shimmer-intense::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 25%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0.3) 75%, transparent 100%);
      animation: bar-shimmer 1.8s ease-in-out infinite;
    }
    .glow-blue { box-shadow: 0 0 10px rgba(59, 130, 246, 0.35); }
    .glow-fire { box-shadow: 0 0 12px rgba(249, 115, 22, 0.4); }
    .glow-red { box-shadow: 0 0 14px rgba(239, 68, 68, 0.4); }
    .glow-gold { box-shadow: 0 0 16px rgba(234, 179, 8, 0.45), 0 0 6px rgba(234, 179, 8, 0.2); }
    .glow-diamond { box-shadow: 0 0 18px rgba(168, 85, 247, 0.5), 0 0 8px rgba(236, 72, 153, 0.3); }
    .glow-mythic { box-shadow: 0 0 22px rgba(239, 68, 68, 0.5), 0 0 10px rgba(234, 179, 8, 0.35), 0 0 6px rgba(168, 85, 247, 0.25); }
    .glow-pink-legend { box-shadow: 0 0 16px rgba(236, 72, 153, 0.45), 0 0 6px rgba(244, 114, 182, 0.25); }
    .glow-pink-diamond { box-shadow: 0 0 18px rgba(219, 39, 119, 0.5), 0 0 8px rgba(236, 72, 153, 0.3); }
    .glow-pink-mythic { box-shadow: 0 0 22px rgba(190, 24, 93, 0.55), 0 0 10px rgba(219, 39, 119, 0.35); }

    @keyframes bar-shimmer-ultra {
      0% { left: -100%; }
      100% { left: 100%; }
    }
    .bar-shimmer-ultra::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 20%, rgba(255,255,255,0.7) 50%, rgba(255,255,255,0.4) 80%, transparent 100%);
      animation: bar-shimmer-ultra 1.4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .bar-shimmer::after, .bar-shimmer-intense::after, .bar-shimmer-ultra::after { animation: none; }
    }

    /* Dark mode skeleton */
    .dark .skeleton {
      background: linear-gradient(90deg, #1c2230 25%, #252d3d 50%, #1c2230 75%);
      background-size: 1000px 100%;
      animation: shimmer 2s infinite;
    }

    /* Theme toggle */
    .theme-toggle {
      width: 56px;
      height: 28px;
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      background: linear-gradient(135deg, #87CEEB 0%, #60B5E8 100%);
      border: none;
      padding: 0;
      transition: background 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .theme-toggle[aria-checked="true"] {
      background: linear-gradient(135deg, #1a1a3e 0%, #0f1729 100%);
    }
    .theme-toggle::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      border-radius: inherit;
      pointer-events: none;
    }
    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background 0.4s ease,
                  box-shadow 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1;
      background: #FFD700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.5), 0 1px 3px rgba(0,0,0,0.15);
    }
    .theme-toggle[aria-checked="true"] .toggle-thumb {
      transform: translateX(28px);
      background: #e8e8f0;
      box-shadow: 0 0 8px rgba(200, 200, 230, 0.4), 0 1px 3px rgba(0,0,0,0.3);
    }
    .toggle-icon {
      transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: absolute;
    }
    .toggle-icon.sun { opacity: 1; transform: rotate(0deg) scale(1); }
    .toggle-icon.moon { opacity: 0; transform: rotate(-90deg) scale(0.5); }
    .theme-toggle[aria-checked="true"] .toggle-icon.sun { opacity: 0; transform: rotate(90deg) scale(0.5); }
    .theme-toggle[aria-checked="true"] .toggle-icon.moon { opacity: 1; transform: rotate(0deg) scale(1); }

    /* Stars in dark toggle track */
    .toggle-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .theme-toggle[aria-checked="true"] .toggle-stars { opacity: 1; }
    .toggle-star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s ease-in-out infinite alternate;
    }
    .toggle-star:nth-child(1) { top: 6px; left: 8px; animation-delay: 0s; }
    .toggle-star:nth-child(2) { top: 14px; left: 14px; animation-delay: 0.4s; }
    .toggle-star:nth-child(3) { top: 8px; left: 20px; animation-delay: 0.8s; }
    .toggle-star:nth-child(4) { top: 18px; left: 6px; animation-delay: 1.2s; }
    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-slate-50 to-slate-100 dark:from-[#151921] dark:to-[#1a1f2b] min-h-screen transition-colors duration-500">

  <!-- Header -->
  <header class="bg-gradient-to-r from-primary-600 to-primary-700 dark:from-[#1c2230] dark:to-[#151921] text-white shadow-lg transition-colors duration-500">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6 flex items-center justify-between gap-3">
      <div>
        <h1 class="text-xl sm:text-3xl font-bold"><i class="fa-solid fa-person-running" style="color:#FFD43B"></i> ESRace Leaderboard</h1>
        <p class="text-primary-100 dark:text-slate-400 text-xs sm:text-sm mt-1 hidden sm:block">Track your running achievements</p>
      </div>
      <button id="themeToggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Toggle dark mode">
        <div class="toggle-stars">
          <div class="toggle-star"></div>
          <div class="toggle-star"></div>
          <div class="toggle-star"></div>
          <div class="toggle-star"></div>
        </div>
        <div class="toggle-thumb">
          <span class="toggle-icon sun">☀️</span>
          <span class="toggle-icon moon">🌙</span>
        </div>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-8">

    <!-- Race Selector -->
    <div id="raceSelectorSection" class="mb-8">
      <h2 class="text-xl font-semibold text-slate-700 dark:text-slate-200 mb-4"><i class="fa-solid fa-calendar-days" style="color:#74C0FC"></i> Select Race</h2>
      <div id="raceList" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Race cards will be inserted here -->
      </div>
    </div>

    <!-- Race Details Section (hidden initially) -->
    <div id="raceSection" class="hidden">

      <!-- Race Header -->
      <div class="bg-white dark:bg-[#1c2230] rounded-2xl shadow-lg p-4 sm:p-6 mb-4 sm:mb-6 transition-colors duration-300">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 sm:gap-4">
          <div>
            <h2 id="raceName" class="text-lg sm:text-2xl font-bold text-slate-800 dark:text-slate-100"></h2>
            <p id="raceDescription" class="text-slate-600 dark:text-slate-400 mt-1"></p>
          </div>
          <button id="backBtn" class="self-start md:self-center px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-[#252d3d] dark:hover:bg-[#2d3548] dark:text-slate-200 rounded-lg text-sm font-medium transition">
            ← Back to Races
          </button>
        </div>

        <!-- Race Info Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-4 mt-4 sm:mt-6">
          <div class="bg-gradient-to-br from-blue-50 to-blue-100 dark:from-blue-950/30 dark:to-blue-900/20 rounded-xl p-3 sm:p-4">
            <div class="text-xs sm:text-sm text-blue-600 dark:text-blue-400 font-medium"><i class="fa-solid fa-calendar-days"></i> Duration</div>
            <div id="raceDuration" class="text-base font-bold text-blue-900 dark:text-blue-200 mt-1"></div>
          </div>
          <div class="bg-gradient-to-br from-green-50 to-green-100 dark:from-green-950/30 dark:to-green-900/20 rounded-xl p-3 sm:p-4">
            <div class="text-xs sm:text-sm text-green-600 dark:text-green-400 font-medium"><i class="fa-solid fa-person-running"></i> Participants</div>
            <div id="totalRunners" class="text-lg font-bold text-green-900 dark:text-green-200 mt-1">0</div>
          </div>
          <div class="bg-gradient-to-br from-purple-50 to-purple-100 dark:from-purple-950/30 dark:to-purple-900/20 rounded-xl p-3 sm:p-4">
            <div class="text-xs sm:text-sm text-purple-600 dark:text-purple-400 font-medium"><i class="fa-solid fa-route"></i> Total Distance</div>
            <div id="totalDistance" class="text-lg font-bold text-purple-900 dark:text-purple-200 mt-1">0 km</div>
          </div>
          <div class="bg-gradient-to-br from-orange-50 to-orange-100 dark:from-orange-950/30 dark:to-orange-900/20 rounded-xl p-3 sm:p-4">
            <div class="text-xs sm:text-sm text-orange-600 dark:text-orange-400 font-medium"><i class="fa-solid fa-clock"></i> Status</div>
            <div id="raceStatus" class="text-lg font-bold text-orange-900 dark:text-orange-200 mt-1"></div>
          </div>
        </div>
      </div>

      <!-- Leaderboard Controls -->
      <div class="bg-white dark:bg-[#1c2230] rounded-2xl shadow-lg p-4 sm:p-6 mb-4 sm:mb-6 transition-colors duration-300">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 sm:gap-4">
          <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
            <h3 class="text-base sm:text-lg font-semibold text-slate-700 dark:text-slate-200"><i class="fa-solid fa-trophy" style="color:#FFD43B"></i> Leaderboard</h3>
            <!-- Team/Runners tab — only shown when team_mode is on -->
            <div id="viewTabs" class="hidden flex gap-1 bg-slate-100 dark:bg-[#151921] rounded-lg p-1">
              <button data-view="runners" class="view-tab active px-3 py-1 rounded-md text-sm font-medium transition">
                <i class="fa-solid fa-person-running"></i> Runners
              </button>
              <button data-view="teams" class="view-tab px-3 py-1 rounded-md text-sm font-medium transition">
                <i class="fa-solid fa-users"></i> Teams
              </button>
            </div>
          </div>

          <!-- Sort buttons -->
          <div id="sortButtons" class="flex gap-1.5 sm:gap-2">
            <button data-sort="km" class="sort-btn active px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition">
              <i class="fa-solid fa-route"></i> Distance
            </button>
            <button data-sort="pace" class="sort-btn px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition">
              <i class="fa-solid fa-bolt"></i> Pace
            </button>
            <button data-sort="goal" class="sort-btn px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition" id="goalSortBtn" style="display:none">
              <i class="fa-solid fa-bullseye"></i> Goal
            </button>
            <button data-sort="avg" class="sort-btn px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition" id="avgSortBtn" style="display:none">
              <i class="fa-solid fa-scale-balanced"></i> Avg
            </button>
          </div>
        </div>
      </div>

      <!-- Leaderboard / Teams container -->
      <div id="leaderboard" class="space-y-2 sm:space-y-3"></div>

    </div>
  </main>

  <!-- Activity Modal -->
  <div id="activityModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-end sm:items-center justify-center sm:p-4">
    <div class="bg-white dark:bg-[#1c2230] rounded-t-2xl sm:rounded-2xl shadow-2xl max-w-4xl w-full max-h-[95vh] sm:max-h-[90vh] overflow-hidden transition-colors duration-300">
      <div class="p-4 sm:p-6 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
        <div>
          <h3 id="modalRunnerName" class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100"></h3>
          <p id="modalRunnerStats" class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 mt-1"></p>
        </div>
        <button id="closeModal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div id="modalContent" class="p-4 sm:p-6 overflow-y-auto max-h-[calc(95vh-100px)] sm:max-h-[calc(90vh-120px)]">
        <!-- Activities will be inserted here -->
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
